<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Baby 🍼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="640" height="640"></canvas>

    <!-- 모바일 터치 D-패드 (터치 기기/좁은 화면에서만 표시) -->
    <div id="touch-controls" class="touch-controls">
      <div class="dpad">
        <button type="button" class="pad-btn pad-up" data-key="ArrowUp" aria-label="위">▲</button>
        <button type="button" class="pad-btn pad-left" data-key="ArrowLeft" aria-label="왼쪽">◀</button>
        <button type="button" class="pad-btn pad-right" data-key="ArrowRight" aria-label="오른쪽">▶</button>
        <button type="button" class="pad-btn pad-down" data-key="ArrowDown" aria-label="아래">▼</button>
      </div>
      <div class="pad-actions">
        <button type="button" class="pad-btn pad-skill" data-key="Space">울기</button>
        <button type="button" class="pad-btn pad-mute" data-key="KeyM">소리</button>
        <button type="button" class="pad-btn pad-pause" data-key="KeyP">정지</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
