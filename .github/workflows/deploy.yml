name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle (relative base)
        run: npm run build

      # 카카오톡 인앱 브라우저 캐시 우회 산출물 검증
      - name: Verify hashed assets and build version
        run: |
          test -f dist/version.json
          grep -Eq 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html
          grep -q 'version.json' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 가 아직 비활성 상태여도 첫 실행에서 자동 활성화를 시도한다
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
